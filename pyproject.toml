[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG platform with Milvus, vLLM, and Multimodal capabilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.128.0",
    "gunicorn>=24.1.1",
    "httpx>=0.28.1",
    "numpy>=2.4.1",
    "pydantic>=2.12.5",
    "pymilvus>=2.6.6",
    "pymupdf>=1.26.7",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.22",
    "python-socketio>=5.16.0",
    "rapidfuzz>=3.14.3",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "ragas>=0.4.3",
]
