[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG platform with Milvus, vLLM, and Multimodal capabilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "numpy>=2.4.1",
    "pillow>=12.1.0",
    "pydantic>=2.12.5",
    "pymilvus>=2.6.6",
    "pymupdf>=1.26.7",
    "pypdf>=6.6.0",
    "python-docx>=1.2.0",
    "python-socketio>=5.16.0",
    "uvicorn>=0.40.0",
]
